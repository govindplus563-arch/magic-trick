<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b3a86">
<title>CA Inter Study Planner</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div class="shell">
  <main id="view" class="view" aria-live="polite"></main>
  <nav id="nav" class="nav" aria-label="Main"></nav>
  <button id="chatFab" class="fab" type="button" aria-label="Open study assistant">✨ Ask AI</button>
</div>

<dialog id="lectureDialog" class="sheet">
  <form id="lectureForm" method="dialog" autocomplete="off">
    <h2>Add lecture</h2>
    <label>Date <input type="date" name="date" required></label>
    <label>Subject <input type="text" name="subject" required maxlength="60" placeholder="e.g. Taxation"></label>
    <label>Chapter <input type="text" name="chapter" required maxlength="120" placeholder="e.g. GST - Input Tax Credit"></label>
    <div class="row2">
      <label>Lecture no. <input type="text" name="lecture" required maxlength="10" placeholder="12"></label>
      <label>Duration (min) <input type="number" name="duration" required min="1" max="600" placeholder="90"></label>
    </div>
    <div class="actions">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn primary">Add</button>
    </div>
  </form>
</dialog>

<dialog id="rescheduleDialog" class="sheet">
  <form id="rescheduleForm" method="dialog">
    <h2>Reschedule</h2>
    <p class="hint" id="rescheduleWhat"></p>
    <label>New date <input type="date" name="date" required></label>
    <div class="actions">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn primary">Reschedule</button>
    </div>
  </form>
</dialog>

<script src="js/store.js"></script>
<script src="js/home.js"></script>
<script src="js/filetext.js"></script>
<script src="js/revision.js"></script>
<script src="js/backlog.js"></script>
<script src="js/progress.js"></script>
<script src="js/tests.js"></script>
<script src="js/gemini.js"></script>
<script src="js/planner.js"></script>
<script src="js/assistant.js"></script>
<script src="js/app.js"></script>
</body>
</html>
